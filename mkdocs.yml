site_name: Study Spaces
site_description: Legal documents and account help for the Study Spaces Android app
# Changes to the custom domain at step 4 of the plan. Not the same value as the app's
# legal_base_url sentinel — that one stays until the domain is real.
site_url: https://shubhamkrdev.github.io/Study-Spaces/

theme:
  name: material
  language: en
  icon:
    logo: material/book-open-page-variant
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tooltips

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - Terms of Service: terms.md
  - Refund & Cancellation: refunds.md
  - Delete your account: delete-account.md
  - Support: support.md

plugins:
  - search
  # Renders "last updated" from git history rather than a hand-maintained line that goes stale.
  # Requires fetch-depth: 0 in the deploy workflow.
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false

copyright: >
  © 2026 <code>[PLACEHOLDER — registered legal entity name]</code>

extra_css:
  - stylesheets/extra.css
